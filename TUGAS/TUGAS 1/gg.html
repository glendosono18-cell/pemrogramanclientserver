<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="color.css" />

      <main class="content">
        <section class="hero">
          <div><p class="eyebrow">Selamat datang</p><h1>Glen Dosono</h1><p class="subtitle">2025 / Teknik Komputer</p></div>

          <div class="status">
            <span>Status</span>
            <strong>Aktif</strong>

          </div>

        <section class="stats">
          <article class="card highlight"><span>IPK</span><strong>3.84</strong><small>Semester ini</small></article>
          <article class="card"><span>SKS</span><strong>21</strong><small>Telah diambil</small></article>
          <article class="card"><span>Kehadiran</span><strong>96%</strong><small>Rata-rata</small></article>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#" class="active">Beranda</a><a href="#">Akademik</a><a href="#">KRS</a><a href="#">Jadwal</a><a href="#">Nilai</a><a href="#">Profil</a>
